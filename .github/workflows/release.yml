name: Package and publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build the plugin
        run: dotnet build FamilyGuard.slnx --configuration Release
      - name: Package release and repository manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DLL="Jellyfin.Plugin.FamilyGuard/bin/Release/net9.0/Jellyfin.Plugin.FamilyGuard.dll"
          test -f "$DLL"
          mkdir -p dist
          ZIP="FamilyGuard-${VERSION}.zip"
          zip -j "dist/${ZIP}" "$DLL"
          CHECKSUM="$(sha256sum "dist/${ZIP}" | awk '{print $1}')"
          SOURCE_URL="${SERVER_URL}/${REPOSITORY}/releases/download/${TAG}/${ZIP}"
          TIMESTAMP="$(date --utc +%Y-%m-%dT%H:%M:%S.0000000Z)"
          META="Jellyfin.Plugin.FamilyGuard/meta.json"
          python3 - "$META" "$TIMESTAMP" "$VERSION" "$SOURCE_URL" "$CHECKSUM" <<'PY' > dist/manifest.json
          import json
          import sys

          meta_path, timestamp, version, source_url, checksum = sys.argv[1:]
          with open(meta_path, encoding="utf-8") as handle:
              meta = json.load(handle)

          manifest = [{
              "category": meta["category"],
              "description": meta["description"],
              "guid": meta["guid"],
              "name": meta["name"],
              "overview": meta["overview"],
              "owner": meta["owner"],
              "versions": [{
                  "changelog": meta["changelog"],
                  "targetAbi": meta["targetAbi"],
                  "timestamp": timestamp,
                  "version": version,
                  "sourceUrl": source_url,
                  "checksum": checksum,
              }],
          }]
          print(json.dumps(manifest))
          PY
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/FamilyGuard-*.zip dist/manifest.json --clobber
